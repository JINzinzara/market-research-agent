[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-agent"
version = "0.1.0"
description = "Evidence-grounded market research with replayable failures and regression evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx==0.28.1", "pydantic>=2,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
market-agent = "market_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_agent = ["data/*.json", "web/*.html", "web/*.css", "web/*.js"]
