[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-agent"
version = "0.0.1"
description = "A market research agent implemented through file-by-file exercises."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
